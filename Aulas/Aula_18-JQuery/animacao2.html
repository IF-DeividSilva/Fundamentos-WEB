<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Animação #02</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src='js/jquery.js'></script>
    <style>
        body {
            position: relative;
            background-color: #999;
            color: #000;
        }

        div {
            position: absolute;
            display: inline;
            border: solid 10px #000;
            padding: 50px;
            font-size: 3em;
            background-color: crimson;
        }
    </style>
</head>

<body>
    <div>Animar!</div>

    <script>
        // Exemplo de uso de animação personalizada
        // Função para alterar a largura de um elemento
        function alterarLargura(valor, duracao, callback){
            $('div').animate({
                width: `+=${valor}`
            }, duracao, callback);
        }

        // Função para mover um elemento na diagonal
        function moverDiagonal(valor, duracao, callback){
            $('div').animate({
                left: `+=${valor}`,
                top: `+=${valor}`
            }, duracao, callback);
        } 

        // Função para girar um elemento
        function girar(valor, duracao, callback) {
            $('div').animate({ transform: `+=${valor}` }, {
                step: function (valor) {
                    $(this).css('transform', `rotate(${valor}deg)`)
                },
                duration: duracao
            }, 'linear', callback)
        }

        // função encadeada para executar as animações em sequência
        alterarLargura(200, 1000, function() {
            moverDiagonal(100, 1000, function() {
                girar(360, 1000);
            });
        });
    </script>
</body>
