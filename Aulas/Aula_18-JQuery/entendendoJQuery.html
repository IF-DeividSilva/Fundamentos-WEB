<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Entendendo jQuery</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src="js/jquery.js"></script>
</head>

<body class="conteudo exercicio">
    <h1>Entendendo jQuery</h1>
    <div>1</div>
    <div>2</div>

    <script>
        // chama o jquery com "$" ou "jQuery"
        //--------------------------------
        // seletor para pegar a div e fazer uma chamada encadeada
        // hide -> função para esconder
        // show -> funçao para mostrar
        // fadeout -> função para sumir
        //--------------------------------
        $('div').hide(5000).show(5000).fadeOut(5000)
        
        console.log($('div').get(1))
        console.log($.isEmptyObject({ nome: null} ))
        console.log(jQuery.inArray(3, [1, 2, 3]))

        $.fn.fundoVerde = function () {
            this.css('background-color', 'red')
            // para poder encadear funções 
            return this
        }

        $('body').fundoVerde().fadeOut(1000)
    </script>
</body>
