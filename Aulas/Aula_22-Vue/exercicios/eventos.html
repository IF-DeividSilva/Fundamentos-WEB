<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Eventos</title>
    <link rel="stylesheet" href="/css/estilo.css">
    <script src="/js/vue.min.js"></script>
</head>
<body class="exercicio">
    <div id="app">
        <p>Contador: {{ contador }}</p>
        <p>
            <button v-on:click="add">+1</button>
            <button @click="contador -= 2">-2</button>
        </p>
        <p @mousemove="atualizarCoordenadas">
            X: {{ x }}<br>
            Y: {{ y }}<br>
            <span @mousemove.stop> Aqui não</span>
        </p>
        <input type="text" @keyup.d="alerta">
    </div>
    <script>
        new Vue({
            el: '#app',
            data: {
                x: 0,
                y: 0,
                contador: 0
            },
            methods: {
                add() {
                    this.contador++;
                },
                atualizarCoordenadas(event) {
                    this.x = event.clientX;
                    this.y = event.clientY;
                },
                alerta() {
                    alert('Você digitou "d"!');
                }
            }
            

        });
    </script>
</body>
</html>
