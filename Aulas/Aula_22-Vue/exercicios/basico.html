<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Conceitos Básicos</title>
    <link rel="stylesheet" href="/css/estilo.css">
    <script src="/js/vue.min.js"></script>
</head>
<body class="exercicio">
    <div id="app">
        <p>1) {{ 2 + 2}}</p>
        <p>2) {{ "teste".toUpperCase() }}</p>
        <p>3) Produto: {{ nome }}, R$ {{ preco }}, Desconto: {{ desconto * 100 }}%</p>
        <p>4) Preço com desconto: R$ {{ precoComDesconto }}</p>
        <p>5) Hora certa: {{ horaCerta() }}</p>
    </div>
    <script>
        // O Vue é uma função construtora, então para criar um objeto Vue, usamos a palavra reservada new
        new Vue({
            // elemento HTML que o Vue vai controlar
            el: '#app',
            // dados que o Vue vai controlar
            data: {
                nome: 'Caneta',
                preco: 7.99,
                desconto: 0.15
            },
            // métodos que o Vue vai controlar
            methods: {
                horaCerta(){
                    return new Date().toLocaleString()
                }
            },
            // propriedades computadas que o Vue vai controlar
            computed: {
                precoComDesconto(){
                    return this.preco * (1 - this.desconto)
                }
            }
        })
    </script>
</body>
</html>
