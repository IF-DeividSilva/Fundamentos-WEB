<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Componente</title>
    <link rel="stylesheet" href="/css/estilo.css">
    <script src="/js/vue.min.js"></script>
</head>
<body class="exercicio">
    <div id="app">
        <contador ></contador>
        <contador ></contador>
        <contador ></contador>
    </div>

    <script>
        Vue.component('contador', {
            data: function(){
                return {
                    contador: 0
                }
            },
            methods: {
                incrementar() {
                    this.contador++
                }
            },
            template: `
            <div>
                    <h1>{{ contador }}</h1>
                    <button @click="incrementar">Incrementar</button>
                    <button @click="contador--">Decrementar</button>

                </div>
            `
        })

        new Vue({
            el: '#app'
        });
    </script>
</body>
</html>
