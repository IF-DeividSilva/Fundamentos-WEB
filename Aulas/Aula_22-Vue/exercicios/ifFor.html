<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>If & For</title>
    <link rel="stylesheet" href="/css/estilo.css">
    <script src="/js/vue.min.js"></script>
</head>
<body class="exercicio">
    <div id="app">
        <p v-for="(aluno, i) in alunos">
            {{ i + 1}}  {{aluno.nome}} -> {{aluno.nota}} (
                <span v-if="aluno.nota >= 9">Lenda viva</span>
                <span v-if="aluno.nota >= 7">Aprovado</span>
                <span v-else-if="aluno.nota >= 5">Recuperação</span>
                <span v-else>Reprovado</span>
            )
        </p>
        <ul styke="list-style: none">
            <li v-for="n in 8">
                <span v-show="n >= 2"> {{ n }} </span>
            </li>
        </ul>

    </div>
    <script>
        new Vue({
            el: '#app',
            data: {
                alunos: [
                    { nome: 'Ana', nota: 7.5 },
                    { nome: 'Beto', nota: 4.3 },
                    { nome: 'Carlos', nota: 9.9 },
                    { nome: 'Diana', nota: 6.1 }
                ]    
            }
        });
    </script>
</body>
</html>
